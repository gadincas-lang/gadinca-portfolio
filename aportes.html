<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aportes & Recursos - gadinca.com</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --bg-card: #1a1d27;
      --bg-alt: #22262f;
      --border: #2d3140;
      --brand: #6366f1;
      --brand-hover: #818cf8;
      --text: #e2e8f0;
      --text-muted: #8892a8;
      --success: #22c55e;
      --warning: #f59e0b;
      --radius: 8px;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

    .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .header-logo { font-size: 1.25rem; font-weight: 700; color: var(--brand); text-decoration: none; }
    .header-title { font-size: 0.875rem; color: var(--text-muted); }
    .header-user { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; }

    .hero { text-align: center; padding: 6rem 2rem 4rem; max-width: 640px; margin: 0 auto; }
    .hero h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; line-height: 1.2; }
    .hero h1 span { color: var(--brand); }
    .hero p { color: var(--text-muted); font-size: 1.0625rem; margin-bottom: 2rem; max-width: 480px; margin-left: auto; margin-right: auto; }
    .btn-google { display: inline-flex; align-items: center; gap: 0.75rem; background: white; color: #333; font-size: 1rem; font-weight: 500; padding: 0.75rem 2rem; border-radius: 6px; border: none; cursor: pointer; text-decoration: none; transition: box-shadow 0.2s; }
    .btn-google:hover { box-shadow: 0 4px 16px rgba(99,102,241,0.3); }
    .btn-google svg { width: 20px; height: 20px; }

    .main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }

    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; transition: border-color 0.2s; }
    .card:hover { border-color: var(--brand); }

    .card-top { display: flex; align-items: flex-start; gap: 1rem; }
    .card-icon { width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 700; flex-shrink: 0; }
    .icon-pdf { background: rgba(239,68,68,0.15); color: #ef4444; }
    .icon-excel { background: rgba(34,197,94,0.15); color: #22c55e; }
    .icon-word { background: rgba(59,130,246,0.15); color: #3b82f6; }
    .icon-other { background: rgba(99,102,241,0.15); color: var(--brand); }

    .card-info { flex: 1; min-width: 0; }
    .card-title { font-weight: 600; font-size: 0.9375rem; line-height: 1.3; }
    .card-desc { font-size: 0.8125rem; color: var(--text-muted); line-height: 1.5; margin-top: 0.25rem; }

    .card-meta { display: flex; align-items: center; gap: 1rem; font-size: 0.75rem; color: var(--text-muted); }
    .card-meta svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }

    .btn-download { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; background: var(--brand); color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; }
    .btn-download:hover { background: var(--brand-hover); }
    .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-download svg { width: 16px; height: 16px; }

    .footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: var(--text-muted); }
    .footer a { color: var(--brand); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }

    .msg-box { text-align: center; padding: 2rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 1rem; }

    @media (max-width: 640px) {
      .header { padding: 0.75rem 1rem; flex-direction: column; gap: 0.5rem; }
      .hero { padding: 3rem 1rem 2rem; }
      .hero h1 { font-size: 1.5rem; }
      .main { padding: 1rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <a href="https://gadinca.com" class="header-logo">gadinca.com</a>
      <span class="header-title">Aportes & Recursos</span>
    </div>
    <div class="header-user" id="header-user"></div>
  </header>

  <div id="view-login" style="display:none;">
    <div class="hero">
      <h1>Accede gratis a <span>documentos tecnicos</span> para ingenieros</h1>
      <p>Inicia sesion con tu cuenta Google para descargar documentos, plantillas y recursos de ingenieria</p>
      <a href="https://quantia.gadinca.com/api/auth/public/google?redirect=https://gadinca.com/aportes.html" class="btn-google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Iniciar sesion con Google
      </a>
    </div>
  </div>

  <div id="view-aportes" style="display:none;">
    <div class="main">
      <div id="aportes-grid" class="grid">
        <div class="loading">Cargando aportes...</div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <a href="https://gadinca.com">gadinca.com</a>
    &nbsp;&middot;&nbsp;
    <a href="https://wa.me/59175438595">WhatsApp +591 75438595</a>
  </footer>

  <script>
    const API_BASE = 'https://quantia.gadinca.com';
    let token = null;

    function init() {
      const params = new URLSearchParams(window.location.search);

      if (params.get('error')) {
        showView('view-login');
        return;
      }

      const urlToken = params.get('token');
      if (urlToken) {
        sessionStorage.setItem('public_token', urlToken);
        window.history.replaceState({}, '', window.location.pathname);
        token = urlToken;
      } else {
        token = sessionStorage.getItem('public_token');
      }

      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          if (payload.exp * 1000 < Date.now()) {
            sessionStorage.removeItem('public_token');
            token = null;
          } else {
            document.getElementById('header-user').innerHTML =
              `<span>${esc(payload.nombre)}</span>
               <button onclick="cerrarSesion()" style="background:none;border:1px solid var(--border);color:var(--text-muted);padding:0.25rem 0.5rem;border-radius:4px;font-size:0.75rem;cursor:pointer;">Salir</button>`;
          }
        } catch (e) {
          sessionStorage.removeItem('public_token');
          token = null;
        }
      }

      if (token) {
        showView('view-aportes');
        loadAportes();
      } else {
        showView('view-login');
      }
    }

    function showView(id) {
      ['view-login', 'view-aportes'].forEach(v => {
        document.getElementById(v).style.display = v === id ? '' : 'none';
      });
    }

    function esc(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

    function fileIcon(tipo) {
      tipo = (tipo || '').toLowerCase();
      if (tipo === 'pdf') return { cls: 'icon-pdf', label: 'PDF' };
      if (tipo === 'excel' || tipo === 'xlsx' || tipo === 'xls') return { cls: 'icon-excel', label: 'XLS' };
      if (tipo === 'word' || tipo === 'docx' || tipo === 'doc') return { cls: 'icon-word', label: 'DOC' };
      return { cls: 'icon-other', label: 'FILE' };
    }

    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function loadAportes() {
      const grid = document.getElementById('aportes-grid');
      grid.innerHTML = '<div class="loading">Cargando aportes...</div>';

      try {
        const res = await fetch(`${API_BASE}/api/public/catalogo/aportes`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });

        if (res.status === 401) {
          sessionStorage.removeItem('public_token');
          token = null;
          showView('view-login');
          return;
        }

        if (!res.ok) {
          grid.innerHTML = '<div class="msg-box">Error al cargar los aportes. Intenta de nuevo.</div>';
          return;
        }

        const aportes = await res.json();

        if (!aportes.length) {
          grid.innerHTML = '<div class="msg-box">No hay aportes disponibles por el momento.</div>';
          return;
        }

        grid.innerHTML = aportes.map(a => {
          const icon = fileIcon(a.tipo);
          return `<div class="card">
            <div class="card-top">
              <div class="card-icon ${icon.cls}">${icon.label}</div>
              <div class="card-info">
                <div class="card-title">${esc(a.titulo)}</div>
                ${a.descripcion ? `<div class="card-desc">${esc(a.descripcion)}</div>` : ''}
              </div>
            </div>
            <div class="card-meta">
              ${a.tamano ? `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>${formatSize(a.tamano)}</span>` : ''}
              ${a.descargas != null ? `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>${a.descargas} descargas</span>` : ''}
            </div>
            <button class="btn-download" onclick="descargar('${a.id}', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Descargar
            </button>
          </div>`;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<div class="msg-box">Error de conexion. Intenta de nuevo.</div>';
      }
    }

    async function descargar(id, btn) {
      btn.disabled = true;
      btn.textContent = 'Descargando...';

      try {
        const res = await fetch(`${API_BASE}/api/public/catalogo/aportes/${encodeURIComponent(id)}/descargar`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });

        if (res.status === 401) {
          sessionStorage.removeItem('public_token');
          token = null;
          showView('view-login');
          return;
        }

        if (!res.ok) {
          btn.disabled = false;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Descargar';
          return;
        }

        const data = await res.json();
        if (data.url) {
          window.open(data.url, '_blank');
        }
      } catch (err) {
        // silently fail
      }

      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Descargar';
    }

    function cerrarSesion() {
      sessionStorage.removeItem('public_token');
      token = null;
      document.getElementById('header-user').innerHTML = '';
      showView('view-login');
    }

    init();
  </script>

</body>
</html>
